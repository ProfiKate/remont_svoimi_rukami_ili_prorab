<!DOCTYPE html>
<html lang="ru">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Ремонт: делать самому или нанять прораба?</title>
<style>
  * { box-sizing: border-box; margin: 0; padding: 0; }
  body { font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif; background: #F0EDE8; color: #1a1a1a; min-height: 100vh; display: flex; align-items: flex-start; justify-content: center; padding: 2rem 1rem; }
  .wrap { max-width: 560px; width: 100%; }

  /* Header */
  .header { background: linear-gradient(135deg, #FDF8EF, #FFF8E7); border-radius: 16px; padding: 0.75rem 1.25rem; margin-bottom: 12px; box-shadow: 0 2px 12px rgba(201,168,76,0.15); border: 1.5px solid #F0DFA0; }
  .header-top { display: flex; align-items: center; gap: 12px; }
  .logo { width: 72px; height: 72px; min-width: 72px; border-radius: 50%; object-fit: cover; border: 2.5px solid #C9A84C; box-shadow: 0 2px 8px rgba(201,168,76,0.3); margin: -8px 0; }
  .header h1 { font-size: 18px; font-weight: 700; line-height: 1.4; margin-bottom: 4px; color: #1a1a1a; }
  .header p { font-size: 12px; color: #8a7340; line-height: 1.5; font-weight: 500; }

  /* Progress */
  .progress-wrap { height: 5px; background: #E0DBD4; border-radius: 5px; margin-bottom: 12px; }
  .progress-bar { height: 5px; border-radius: 5px; background: linear-gradient(90deg, #378ADD, #5BA8F5); transition: width 0.4s ease; }

  /* Intro card */
  .intro-card { background: #fff; border-radius: 16px; padding: 1.75rem; box-shadow: 0 2px 12px rgba(0,0,0,0.06); text-align: center; }
  .intro-icon { font-size: 48px; margin-bottom: 12px; }
  .intro-title { font-size: 20px; font-weight: 700; margin-bottom: 10px; color: #111; }
  .intro-desc { font-size: 14px; color: #555; line-height: 1.7; margin-bottom: 20px; }
  .insta-cta { display: flex; align-items: center; justify-content: center; gap: 10px; background: linear-gradient(135deg, #f9ce34, #ee2a7b, #6228d7); border-radius: 12px; padding: 13px 18px; margin-bottom: 12px; text-decoration: none; }
  .insta-cta svg { width: 22px; height: 22px; fill: #fff; flex-shrink: 0; }
  .insta-cta span { color: #fff; font-size: 15px; font-weight: 600; }
  .intro-already { display: block; width: 100%; padding: 12px; border-radius: 12px; border: 1.5px solid #EEEBE6; background: #FAFAF9; color: #555; cursor: pointer; font-size: 14px; font-weight: 500; transition: all 0.15s; }
  .intro-already:hover { background: #F0EDE8; }

  /* Question card */
  .q-card { background: #fff; border-radius: 16px; padding: 1.5rem; box-shadow: 0 2px 12px rgba(0,0,0,0.06); }
  .q-num { font-size: 11px; font-weight: 600; color: #378ADD; text-transform: uppercase; letter-spacing: 0.5px; margin-bottom: 8px; }
  .q-text { font-size: 16px; font-weight: 600; line-height: 1.5; margin-bottom: 16px; color: #111; }

  /* Options */
  .opt-btn { display: flex; align-items: center; gap: 12px; width: 100%; text-align: left; padding: 12px 14px; margin-bottom: 8px; border-radius: 12px; border: 1.5px solid #EEEBE6; background: #FAFAF9; color: #333; cursor: pointer; font-size: 14px; line-height: 1.5; transition: all 0.15s ease; }
  .opt-btn:hover { background: #F5F2EE; border-color: #D8D2C8; }
  .opt-btn.selected { border-color: #378ADD; background: #EBF4FC; color: #0C447C; }
  .opt-btn.selected .opt-dot { background: #378ADD; border-color: #378ADD; }
  .opt-btn.selected .opt-dot::after { opacity: 1; }
  .opt-dot { flex-shrink: 0; width: 18px; height: 18px; border-radius: 50%; border: 2px solid #CCC; background: #fff; display: flex; align-items: center; justify-content: center; transition: all 0.15s; }
  .opt-dot::after { content: ''; width: 8px; height: 8px; border-radius: 50%; background: #fff; opacity: 0; transition: opacity 0.15s; }

  /* Nav */
  .nav-row { display: flex; gap: 10px; margin-top: 16px; }
  .nav-btn { flex: 1; padding: 12px; border-radius: 12px; border: 1.5px solid #EEEBE6; background: #FAFAF9; color: #555; cursor: pointer; font-size: 14px; font-weight: 500; transition: all 0.15s; }
  .nav-btn:hover { background: #F0EDE8; }
  .nav-btn.primary { background: linear-gradient(135deg, #378ADD, #185FA5); color: #fff; border-color: transparent; box-shadow: 0 3px 10px rgba(55,138,221,0.3); }
  .nav-btn.primary:hover { background: linear-gradient(135deg, #2a78cc, #124e8a); }
  .nav-btn:disabled { opacity: 0.3; cursor: default; }

  /* Result */
  .result-card { background: #fff; border-radius: 16px; padding: 1.75rem; box-shadow: 0 2px 12px rgba(0,0,0,0.06); margin-bottom: 12px; }
  .result-icon { font-size: 44px; margin-bottom: 10px; }
  .result-title { font-size: 24px; font-weight: 700; margin-bottom: 14px; color: #111; }
  .score-bar { display: flex; gap: 5px; margin-bottom: 8px; height: 7px; border-radius: 5px; overflow: hidden; }
  .score-seg { height: 7px; border-radius: 5px; background: #eee; }
  .score-seg.s { background: #1D9E75; }
  .score-seg.h { background: #EF9F27; }
  .score-seg.p { background: #378ADD; }
  .score-legend { display: flex; gap: 16px; font-size: 12px; color: #999; margin-bottom: 18px; }
  .result-desc { font-size: 14px; color: #444; line-height: 1.8; margin-bottom: 14px; }
  .result-tip { font-size: 13px; color: #555; border-left: 3px solid #378ADD; padding: 8px 12px; background: #F0F7FF; border-radius: 0 8px 8px 0; line-height: 1.6; margin-bottom: 18px; }

  /* Insta block in result */
  .insta-block { background: #FDF8EF; border: 1.5px solid #F0DFA0; border-radius: 12px; padding: 14px 16px; display: flex; align-items: center; gap: 12px; }
  .insta-block-icon { flex-shrink: 0; width: 36px; height: 36px; border-radius: 8px; background: linear-gradient(135deg, #f9ce34, #ee2a7b, #6228d7); display: flex; align-items: center; justify-content: center; order: 2; }
  .insta-block-icon svg { width: 20px; height: 20px; fill: #fff; }
  .insta-block-text { font-size: 13px; color: #555; line-height: 1.7; order: 1; }
  .insta-block-text a { color: #ee2a7b; font-weight: 600; text-decoration: none; }
  .insta-block-text a:hover { text-decoration: underline; }

  .restart-btn { display: block; width: 100%; padding: 13px; border-radius: 12px; border: 1.5px solid #EEEBE6; background: #fff; color: #555; cursor: pointer; font-size: 14px; font-weight: 500; transition: all 0.15s; box-shadow: 0 2px 8px rgba(0,0,0,0.05); }
  .restart-btn:hover { background: #F5F2EE; }
</style>
</head>
<body>
<div class="wrap">
  <div class="header">
    <div class="header-top">
      <img class="logo" src="SK.png" alt="logo">
      <div>
        <h1>Делать ремонт самому или нанять прораба?</h1>
        <p>15 вопросов, которые помогут вам определить оптимальный вариант ремонта</p>
      </div>
    </div>
  </div>
  <div class="progress-wrap"><div class="progress-bar" id="pbar" style="width:0%"></div></div>
  <div id="quiz-body"></div>
</div>

<script>
const igSVG = `<svg viewBox="0 0 24 24" xmlns="http://www.w3.org/2000/svg"><path d="M12 2.163c3.204 0 3.584.012 4.85.07 1.366.062 2.633.333 3.608 1.308.975.975 1.246 2.242 1.308 3.608.058 1.266.07 1.646.07 4.85s-.012 3.584-.07 4.85c-.062 1.366-.333 2.633-1.308 3.608-.975.975-2.242 1.246-3.608 1.308-1.266.058-1.646.07-4.85.07s-3.584-.012-4.85-.07c-1.366-.062-2.633-.333-3.608-1.308-.975-.975-1.246-2.242-1.308-3.608C2.175 15.584 2.163 15.204 2.163 12s.012-3.584.07-4.85c.062-1.366.333-2.633 1.308-3.608C4.516 2.496 5.783 2.225 7.149 2.163 8.415 2.105 8.796 2.163 12 2.163zm0-2.163C8.741 0 8.332.014 7.052.072 5.197.157 3.355.673 2.014 2.014.673 3.355.157 5.197.072 7.052.014 8.332 0 8.741 0 12c0 3.259.014 3.668.072 4.948.085 1.855.601 3.697 1.942 5.038 1.341 1.341 3.183 1.857 5.038 1.942C8.332 23.986 8.741 24 12 24s3.668-.014 4.948-.072c1.855-.085 3.697-.601 5.038-1.942 1.341-1.341 1.857-3.183 1.942-5.038.058-1.28.072-1.689.072-4.948 0-3.259-.014-3.668-.072-4.948-.085-1.855-.601-3.697-1.942-5.038C20.645.673 18.803.157 16.948.072 15.668.014 15.259 0 12 0zm0 5.838a6.162 6.162 0 1 0 0 12.324 6.162 6.162 0 0 0 0-12.324zm0 10.162a4 4 0 1 1 0-8 4 4 0 0 1 0 8zm6.406-11.845a1.44 1.44 0 1 0 0 2.881 1.44 1.44 0 0 0 0-2.881z"/></svg>`;

const questions = [
  { q: "Какой у вас бюджет на ремонт?", opts: [
    ["Минимальный — хочу сэкономить на всём: и на работах, и на материалах", 2,0,0],
    ["Средний — готов платить за работы и нормальные материалы, но без лишних трат", 1,1,0],
    ["Выше среднего — качество важнее экономии, готов платить профессионалам", 0,1,1],
    ["Не ограничен — хочу результат без лишних хлопот", 0,0,2]
  ]},
  { q: "Сколько свободного времени у вас есть на ремонт?", opts: [
    ["Много — могу уделять несколько часов каждый день", 2,0,0],
    ["Немного — пара вечеров и выходные", 1,1,0],
    ["Только выходные, и то не всегда", 0,1,1],
    ["Почти нет — работа и дела занимают всё время", 0,0,2]
  ]},
  { q: "Что именно нужно сделать? Выберите ближайшее к вашей ситуации:", opts: [
    ["Косметический ремонт: обои, покраска, замена плинтусов и мелочей", 2,0,0],
    ["Замена полов, плитка в ванной, новые двери — без серьёзных вмешательств", 1,1,0],
    ["Капитальный ремонт нескольких комнат, возможно частичная замена коммуникаций", 0,1,1],
    ["Полный ремонт, перепланировка и/или полная замена электрики и труб", 0,0,2]
  ]},
  { q: "Есть ли у вас опыт в ремонтных работах?", opts: [
    ["Да, делал ремонт раньше и справился", 2,0,0],
    ["Немного — умею что-то простое", 1,1,0],
    ["Теоретический: смотрел ролики, читал — но руками почти не делал", 0,1,1],
    ["Нет совсем — даже гвоздь забить страшновато", 0,0,2]
  ]},
  { q: "Как вы относитесь к рискам и возможным ошибкам?", opts: [
    ["Спокойно — ошибусь, переделаю, зато научусь", 2,0,0],
    ["Допускаю небольшой риск, если цена ошибки невысокая", 1,1,0],
    ["Хочу минимум рисков — готов контролировать, но ошибок не хочу", 0,1,1],
    ["Совсем не готов — лучше сразу сделать правильно и заплатить за это", 0,0,2]
  ]},
  { q: "Готовы ли вы сами искать и координировать мастеров?", opts: [
    ["Да, всё организую сам — мне не сложно", 2,0,0],
    ["Могу найти узких специалистов под конкретные задачи, но не хочу быть прорабом", 1,1,0],
    ["Предпочту, чтобы кто-то один взял на себя координацию всего процесса", 0,1,1],
    ["Нет — не хочу тратить на это время и нервы вообще", 0,0,2]
  ]},
  { q: "Где вы будете находиться во время ремонта?", opts: [
    ["Живу там же — буду видеть всё своими глазами каждый день", 2,0,0],
    ["Живу в другом месте, но готов приезжать часто — несколько раз в неделю", 1,1,0],
    ["Живу в другом месте, смогу заглядывать раз в неделю или реже", 0,1,1],
    ["Бывать там почти не смогу — нужен кто-то, кто будет контролировать", 0,0,2]
  ]},
  { q: "Есть ли у вас доступ к инструментам?", opts: [
    ["Да, есть всё нужное", 2,0,0],
    ["Кое-что есть, остальное можно взять или купить", 1,1,0],
    ["Только базовое — дрель, молоток, отвёртка", 0,1,1],
    ["Почти ничего нет", 0,0,2]
  ]},
  { q: "Что для вас главный приоритет?", opts: [
    ["Сэкономить деньги — даже если займёт больше времени и сил", 2,0,0],
    ["Баланс: сэкономить там, где можно, и не мучиться там, где сложно", 1,1,0],
    ["Качество результата при разумной цене", 0,1,1],
    ["Сделать быстро и без головной боли — деньги не главное", 0,0,2]
  ]},
  { q: "Насколько сложный дизайн-проект вы планируете?", opts: [
    ["Простой — стандартные решения, без особых изысков", 2,0,0],
    ["Умеренный — несколько интересных элементов, продуманная цветовая схема", 1,1,0],
    ["Продуманный — с нюансами, авторскими деталями и точным исполнением", 0,1,1],
    ["Сложный — много нестандартного, важна точность реализации", 0,0,2]
  ]},
  { q: "Есть ли в квартире скрытые проблемы (старая проводка, трубы, кривые стены)?", opts: [
    ["Нет, всё в хорошем состоянии", 2,0,0],
    ["Есть мелкие нюансы, но некритично", 1,1,0],
    ["Есть, и под часть из них нужны специалисты", 0,1,1],
    ["Да, серьёзные — там без профессионалов не обойтись", 0,0,2]
  ]},
  { q: "Как вы относитесь к делегированию?", opts: [
    ["Люблю всё контролировать и делать сам — так спокойнее", 2,0,0],
    ["Могу доверить часть задач, за ключевыми этапами слежу сам", 1,1,0],
    ["Готов доверить почти всё, если человек проверенный", 0,1,1],
    ["Хочу отдать задачу целиком и просто получить результат", 0,0,2]
  ]},
  { q: "Есть ли у вас проверенные мастера в окружении?", opts: [
    ["Есть — и я планирую делать ремонт с их помощью", 2,0,0],
    ["Есть пара знакомых специалистов под конкретные задачи (плитка, электрика)", 1,1,0],
    ["Нет проверенных, буду искать через отзывы и рекомендации", 0,1,1],
    ["Нет, и искать самому не хочу — лучше отдать всё прорабу", 0,0,2]
  ]},
  { q: "Как вы воспринимаете процесс ремонта?", opts: [
    ["С интересом — люблю делать что-то своими руками", 2,0,0],
    ["Нормально — главное, чтобы шло по плану и без сюрпризов", 1,1,0],
    ["Как неизбежное — хочу пережить побыстрее и с минимумом участия", 0,1,1],
    ["С тревогой — для меня это стресс, хочу минимум вовлечённости", 0,0,2]
  ]},
  { q: "Насколько вы готовы разбираться в технических деталях (электрика, сантехника)?", opts: [
    ["Мне интересно и я уже разбираюсь — могу сделать сам", 2,0,0],
    ["Готов изучить основы, чтобы контролировать мастеров", 1,1,0],
    ["Хочу понимать в общих чертах, детали пусть решают специалисты", 0,1,1],
    ["Не хочу вникать вообще — это не моё", 0,0,2]
  ]},
];

const results = [
  { type:"s", icon:"🔨", title:"Делай сам!", desc:"У тебя есть всё, что нужно: время, опыт, желание и правильный настрой. Косметический и несложный ремонт — твоя территория. Ты сэкономишь деньги и получишь результат, которым будешь гордиться.", tip:"По электрике и сантехнике всё равно проконсультируйся со специалистом — это убережёт от дорогих ошибок." },
  { type:"h", icon:"🤝", title:"Гибридный формат", desc:"Твоя оптимальная стратегия — часть работ берёшь на себя, сложные или специфические этапы отдаёшь узким специалистам. Так и бюджет сохранишь, и результат получишь надёжный.", tip:"Отделку и покраску — сам, электрику, сантехнику и стяжку — проверенным мастерам." },
  { type:"p", icon:"👷", title:"Нужен прораб", desc:"Твой проект, ритм жизни или масштаб задач требуют профессионального управления. Прораб сэкономит время, нервы и убережёт от дорогостоящих ошибок. Твоя задача — чётко поставить задачу и контролировать результат.", tip:"Перед наймом проверь отзывы, портфолио и обязательно заключи договор с фиксированной сметой." },
];

let answers = new Array(questions.length).fill(null);
let cur = 0;
let started = false;

function showIntro() {
  const body = document.getElementById("quiz-body");
  document.getElementById("pbar").style.width = "0%";
  body.innerHTML = `
    <div class="intro-card">
      <div class="intro-icon">👋</div>
      <div class="intro-title">Прежде чем начать...</div>
      <div class="intro-desc">Здесь я делюсь честными лайфхаками про ремонт и дизайн интерьера. Подпишись, чтобы не пропустить полезное — и начинай тест!</div>
      <a class="insta-cta" href="https://instagram.com/designproject_ks" target="_blank">
        ${igSVG}
        <span>Подписаться на @designproject_ks</span>
      </a>
      <button class="intro-already" onclick="startQuiz()">Я уже подписан — начать тест →</button>
    </div>
  `;
}

function startQuiz() {
  started = true;
  render();
}

function render() {
  if (!started) { showIntro(); return; }
  const body = document.getElementById("quiz-body");
  document.getElementById("pbar").style.width = (cur / questions.length * 100) + "%";
  if (cur >= questions.length) { showResult(body); return; }
  const q = questions[cur];
  let html = `<div class="q-card">
    <div class="q-num">Вопрос ${cur+1} из ${questions.length}</div>
    <div class="q-text">${q.q}</div>`;
  q.opts.forEach((o, i) => {
    const sel = answers[cur] === i ? " selected" : "";
    html += `<button class="opt-btn${sel}" onclick="pick(${i})"><span class="opt-dot"></span>${o[0]}</button>`;
  });
  html += `<div class="nav-row">
    <button class="nav-btn" onclick="go(-1)"${cur===0?" disabled":""}>← Назад</button>
    <button class="nav-btn primary" onclick="go(1)"${answers[cur]===null?" disabled":""}>${cur===questions.length-1?"Узнать результат →":"Дальше →"}</button>
  </div></div>`;
  body.innerHTML = html;
}

function pick(i) { answers[cur] = i; render(); }
function go(d) { cur = Math.max(0, Math.min(questions.length, cur+d)); render(); }

function showResult(body) {
  let s=0,h=0,p=0;
  answers.forEach((a,qi) => { if(a!==null){s+=questions[qi].opts[a][1];h+=questions[qi].opts[a][2];p+=questions[qi].opts[a][3];} });
  const r = (s>=h&&s>=p) ? results[0] : (h>=p) ? results[1] : results[2];
  const seg = (n, t) => `<div class="score-seg${r.type===t?" "+t:""}" style="flex:${Math.max(n,1)}"></div>`;
  document.getElementById("pbar").style.width = "100%";
  body.innerHTML = `
    <div class="result-card">
      <div class="result-icon">${r.icon}</div>
      <div class="result-title">${r.title}</div>
      <div class="score-bar">${seg(s,"s")}${seg(h,"h")}${seg(p,"p")}</div>
      <div class="score-legend">
        <span style="color:#1D9E75">● Сам: ${s}</span>
        <span style="color:#EF9F27">● Гибрид: ${h}</span>
        <span style="color:#378ADD">● Прораб: ${p}</span>
      </div>
      <div class="result-desc">${r.desc}</div>
      <div class="result-tip">${r.tip}</div>
      <div class="insta-block">
        <div class="insta-block-icon">${igSVG}</div>
        <div class="insta-block-text">Больше лайфхаков, честных советов и проектных решений по ремонту — в Instagram: <a href="https://instagram.com/designproject_ks" target="_blank">@designproject_ks</a>. Подписывайся, чтобы не упустить полезное!</div>
      </div>
    </div>
    <button class="restart-btn" onclick="restart()">Пройти тест заново</button>
  `;
}

function restart() { answers = new Array(questions.length).fill(null); cur=0; started=false; showIntro(); }
